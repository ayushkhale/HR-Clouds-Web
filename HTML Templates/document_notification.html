<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="en">
<head>
  <title>Document update — HRClouds</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light"><!--[if mso]>
  <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch><o:AllowPNG/></o:OfficeDocumentSettings></xml>
  <style>table, td, p, a, span, h1, div { font-family: Arial, Helvetica, sans-serif !important; }</style>
  <![endif]--><!--[if !mso]><!-->
  <link href="https://fonts.googleapis.com/css2?family=Orbit&amp;display=swap" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" type="text/css"><!--<![endif]-->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; display: block; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    #MessageViewBody a { color: inherit; text-decoration: none; }
    p { line-height: inherit; }
    .btn-white:hover { background-color: #EDE9FE !important; }

    /* Web (desktop webmail) is the primary design; everything below is the
       phone-app variation. The container is already fluid (max 640px), so a
       mail app that ignores this block still fits the screen. */
    @media (max-width: 660px) {
      .container { width: 100% !important; }
      .px { padding-left: 20px !important; padding-right: 20px !important; }
      .hero-pad { padding-top: 28px !important; padding-bottom: 32px !important; }
      .hero-title { font-size: 32px !important; line-height: 36px !important; letter-spacing: -1px !important; }
      .lead { font-size: 15px !important; line-height: 23px !important; }
      .hide-mobile { display: none !important; max-height: 0 !important; overflow: hidden !important; mso-hide: all; }
      .foot-pad { padding-top: 28px !important; padding-bottom: 32px !important; }
      .otp-code { font-size: 30px !important; letter-spacing: 8px !important; padding-left: 8px !important; }
      .otp-cell { padding: 16px 24px !important; }
      .logo { width: 120px !important; }
      .head-btn { padding: 8px 14px !important; font-size: 13px !important; }
      .stack { display: block !important; width: 100% !important; text-align: left !important; padding-left: 0 !important; padding-right: 0 !important; }
      .stack-gap { padding-top: 16px !important; }
      .band { padding: 52px 20px 34px !important; }
      .fact { display: block !important; width: 100% !important; }
      .fact + .fact { border-left: 0 !important; border-top: 1px solid #EDE9FE !important; }
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #0e1318;">
  <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; color: #0e1318;">A document update from HRClouds.&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
  <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color: #0e1318;">
    <tr>
      <td align="center">
        <!--[if mso]><table role="presentation" width="640" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table class="container" role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="width: 100%; max-width: 640px;">

          <!-- Header -->
          <tr>
            <td class="px" style="padding: 26px 48px 10px; background-color: #6328D7;">
              <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="left" valign="middle">
                    <a href="https://hrclouds.in" target="_blank"><img class="logo" src="https://frontend.dev.hrclouds.in/logocolorwhite.png" width="140" alt="HRClouds" style="width: 140px; height: auto;"></a>
                  </td>
                  <td align="right" valign="middle">
                    <a class="btn-white head-btn" href="https://hrclouds.in" target="_blank" style="display: inline-block; padding: 11px 22px; background-color: #ffffff; border-radius: 6px; font-family: 'Orbit', 'Helvetica', Arial, sans-serif; font-size: 15px; font-weight: 600; color: #6328D7; text-decoration: none; white-space: nowrap;">Discover More &rarr;</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Hero -->
          <tr>
            <td class="px hero-pad" align="center" style="padding: 40px 56px 48px; background-color: #6328D7;">
              <p style="margin: 0 0 14px; font-family: 'Orbit', 'Helvetica', Arial, sans-serif; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #DDD6FE;">Documents</p>
              <h1 class="hero-title" style="margin: 0; font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; font-size: 46px; line-height: 50px; font-weight: 400; letter-spacing: -1.5px; color: #ffffff;">{{HEADLINE}}</h1>
              <p class="lead" style="margin: 18px 0 0; font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; font-size: 17px; line-height: 26px; color: #EDE9FE;">{{BODY}}</p>
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center" style="margin-top: 30px;">
                <tr>
                  <td align="center" style="border-radius: 8px; background-color: #ffffff;">
                    <a class="btn-white" href="{{CTA_URL}}" target="_blank" style="display: inline-block; padding: 15px 34px; border-radius: 8px; background-color: #ffffff; font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; color: #6328D7; text-decoration: none;">{{CTA_LABEL}} &rarr;</a>
                  </td>
                </tr>
              </table>
              <p style="margin: 22px 0 0; font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 21px; color: #DDD6FE;">Sent on behalf of {{ORG_NAME}}.</p>
              <!-- Hero photo (same art as the main OTP email). Web only: on a
                   phone it would push the code/button below a screen of art. -->
              <table class="hide-mobile" role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="margin-top: 34px;">
                <tr>
                  <td align="center">
                    <img src="https://i.ibb.co/39tMZtvT/4-01-double-optin-glitch.png" width="528" alt="" style="display: block; width: 100%; max-width: 528px; height: auto; border: 0;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Tagline band on the purple perspective grid (Outlook shows the flat purple fallback) -->
          <tr>
            <td class="band" align="center" background="https://i.ibb.co/m5CHZXD1/6-05-Base-Grid-04.png" style="padding: 150px 20px 84px; background-color: #9466FC; background-image: url('https://i.ibb.co/m5CHZXD1/6-05-Base-Grid-04.png'); background-position: center top; background-repeat: no-repeat; background-size: auto;">
              <p style="margin: 0; font-family: 'Orbit', 'Helvetica', Arial, sans-serif; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: #0e1318;">Smart HR. Simplified.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="px foot-pad" style="padding: 40px 56px 44px; background-color: #ffffff;">
              <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td class="stack" valign="top" align="left">
                    <a href="https://hrclouds.in" target="_blank"><img src="https://hrclouds.in/logocolored.png" width="104" alt="HRClouds" style="width: 104px; height: auto;"></a>
                    <p style="margin: 14px 0 0; font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 21px; color: #0e1318;">&copy; {{YEAR}} HR Vista Soft Solutions LLP. All rights reserved.</p>
                  </td>
                  <td class="stack stack-gap" valign="top" align="right" style="font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 26px;">
                    <a href="https://hrclouds.in/legal/privacy" target="_blank" style="color: #6328D7; text-decoration: underline;">Privacy Policy</a><br>
                    <a href="https://hrclouds.in/legal/terms" target="_blank" style="color: #6328D7; text-decoration: underline;">Terms of Service</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
