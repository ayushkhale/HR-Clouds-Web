name: Deploy Frontend (Dev) to Nginx

on:
  push:
    branches:
      - dev

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Frontend Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build with dev environment
      run: npm run build
      env:
        VITE_API_BASE_URL: https://development.hrclouds.in/api/v1
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID_TEST }}
        VITE_DOCMIND_API_KEY: ${{ secrets.VITE_DOCMIND_API_KEY }}

    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh/
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Deploy to Server
      run: |
        SERVER_USER=${{ secrets.SERVER_USER }}
        SERVER_IP=${{ secrets.SERVER_IP }}
        BUILD_DIR="dist/"
        WEB_ROOT="/home/$SERVER_USER/hrms-frontend-dev"

        ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
          mkdir -p $WEB_ROOT
        "

        rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./$BUILD_DIR $SERVER_USER@$SERVER_IP:$WEB_ROOT

        ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
          chmod +x /home/$SERVER_USER
          chmod -R 755 $WEB_ROOT
          sudo systemctl reload nginx
        "
