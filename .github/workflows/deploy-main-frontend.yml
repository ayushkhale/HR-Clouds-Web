name: Deploy Frontend (Production) to Nginx

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Build & Deploy Production Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Dynamically synthesize .env.production safely via step-level env
      - name: Generate .env.production
        env:
          API_BASE_URL: "https://api.hrclouds.in/api/v1"
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID_LIVE }}
          DOCMIND_API_KEY: ${{ secrets.VITE_DOCMIND_API_KEY }}
          DOCMIND_API_URL: ${{ secrets.VITE_DOCMIND_API_URL }}
        run: |
          cat <<EOF > .env.production
          VITE_API_BASE_URL=$API_BASE_URL
          VITE_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          VITE_RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID
          VITE_DOCMIND_API_KEY=$DOCMIND_API_KEY
          VITE_DOCMIND_API_URL=$DOCMIND_API_URL
          EOF

      # Build targeting production environment (Vite default is production)
      - name: Compile Frontend Bundle
        run: npm run build

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to Production Server
        run: |
          SERVER_USER=${{ secrets.SERVER_USER }}
          SERVER_IP=${{ secrets.SERVER_IP }}
          BUILD_DIR="dist/"
          WEB_ROOT="/home/$SERVER_USER/hrms-frontend-main"

          # Verify web root directory exists
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p $WEB_ROOT"

          # Sync built dist folder
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./$BUILD_DIR $SERVER_USER@$SERVER_IP:$WEB_ROOT

          # Enforce file permissions and reload Nginx
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
            chmod +x /home/$SERVER_USER
            chmod -R 755 $WEB_ROOT
            sudo systemctl reload nginx
          "
